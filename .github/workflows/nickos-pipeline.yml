name: Nickos CI

on:
  push:
    branches:
      - main
      - develop-*
  pull_request:
    branches:
      - main

jobs:
  test-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: show project files
        run:  ls -la
        
      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run:  python -m pytest tests --maxfail=1 --disable-warnings -q

      - name: Build backend image
        run: docker build -t devopschima11/nickosstandardsite-backend:v1.1.0 ./backend

      - name: Build frontend image
        run: docker build -t devopschima11/nickosite:v1.1 ./frontend

      - name: login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push backend image to DockerHub
        run: docker push devopschima11/nickosstandardsite-backend:v1.1.0

      - name: Push frontend image to DockerHub
        run: docker push devopschima11/nickosite:v1.1